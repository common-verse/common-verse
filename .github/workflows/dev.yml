name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      reset:
        description: Reset dev data (all demo data and accounts are recreated)
        type: boolean
        default: false

concurrency:
  group: dev
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/veridynn

jobs:
  build:
    if: ${{ !inputs.reset }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [web, cms]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            PUBLIC_SITE_URL=https://common-verse.weimer.pro
            PUBLIC_CMS_URL=https://cms-common-verse.weimer.pro
          tags: |
            ${{ env.REGISTRY }}/common-verse-${{ matrix.target }}:dev
            ${{ env.REGISTRY }}/common-verse-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.reset) }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      # The key can only run deploy/deploy.sh on the server, with this commit SHA.
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEV_KNOWN_HOSTS }}
          HOST: ${{ vars.DEV_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMAND: ${{ inputs.reset && format('reset {0}', github.sha) || github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$TOKEN" | ssh "deploy@$HOST" "$COMMAND"
