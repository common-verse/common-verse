name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      reset:
        description: Reset dev data (all demo data and accounts are recreated)
        type: boolean
        default: false

concurrency:
  group: dev
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/common-verse

jobs:
  # Compares with the last successful deploy, so runs that were cancelled or failed
  # in between are covered. Without one, both apps build.
  changes:
    if: ${{ !inputs.reset }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.diff.outputs.base }}
      web: ${{ steps.diff.outputs.web }}
      cms: ${{ steps.diff.outputs.cms }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh run list -w dev.yml -b dev -s success -L 1 --json headSha -q '.[0].headSha')
          if [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD); then
            # Anything outside the two apps, docs, deploy files and tests rebuilds both.
            shared=$(printf '%s\n' "$files" | grep -Ev '^(apps/(web|cms)|docs|deploy|tests)/|\.md$' || true)
            for app in web cms; do
              changed=false
              { [ -n "$shared" ] || printf '%s\n' "$files" | grep -q "^apps/$app/"; } && changed=true
              echo "$app=$changed" >> "$GITHUB_OUTPUT"
            done
            echo "base=$base" >> "$GITHUB_OUTPUT"
          else
            printf 'web=true\ncms=true\n' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [web, cms]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ needs.changes.outputs[matrix.target] == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            PUBLIC_SITE_URL=https://common-verse.weimer.pro
            PUBLIC_CMS_URL=https://cms-common-verse.weimer.pro
            PUBLIC_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/common-verse-${{ matrix.target }}:dev
            ${{ env.REGISTRY }}/common-verse-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      # Unchanged app: the deployed image gets this commit's tag, deploy.sh stays as is.
      - if: ${{ needs.changes.outputs[matrix.target] != 'true' }}
        run: >-
          docker buildx imagetools create
          -t ${{ env.REGISTRY }}/common-verse-${{ matrix.target }}:${{ github.sha }}
          ${{ env.REGISTRY }}/common-verse-${{ matrix.target }}:${{ needs.changes.outputs.base }}

  deploy:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.reset) }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      # The key can only run deploy/deploy.sh on the server, with this commit SHA.
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEV_KNOWN_HOSTS }}
          HOST: ${{ vars.DEV_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMAND: ${{ inputs.reset && format('reset {0}', github.sha) || github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$TOKEN" | ssh "deploy@$HOST" "$COMMAND"
