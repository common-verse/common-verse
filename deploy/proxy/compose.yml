# Shared reverse proxy for every environment on the server. Environment stacks
# join the external "edge" network so Caddy reaches them by container name.
name: proxy

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]

networks:
  edge:
    name: edge

volumes:
  caddy-data:
  caddy-config:
