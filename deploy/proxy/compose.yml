# Shared entry point for every environment on the server. Cloudflare Tunnel
# brings requests in (TLS and Cloudflare Access login happen at Cloudflare), so no
# ports are published. Environment stacks join the external "edge" network so
# Caddy reaches them by container name.
name: proxy

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    depends_on: [caddy]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [default, edge]

networks:
  edge:
    name: edge

volumes:
  caddy-data:
  caddy-config:
